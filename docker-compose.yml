version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: ledgercore-postgres
    restart: always
    environment:
      POSTGRES_USER: ledger_user
      POSTGRES_PASSWORD: ledger_password
      POSTGRES_DB: ledgercore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_user -d ledgercore"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledgercore-app
    restart: always
    environment:
      DATABASE_URL: postgresql://ledger_user:ledger_password@db:5432/ledgercore
      TEST_DATABASE_URL: postgresql://ledger_user:ledger_password@db:5432/ledgercore_test
      PORT: 8000
      HOST: 0.0.0.0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
